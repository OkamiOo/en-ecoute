<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>En Écoute</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="card" class="card hidden" data-layout="bar">
    <div class="glow" id="glow"></div>

    <div class="art-wrap">
      <img id="art" class="art" alt="">
      <div id="artFallback" class="art art-fallback">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 18V5l12-2v13" />
          <circle cx="6" cy="18" r="3" />
          <circle cx="18" cy="16" r="3" />
        </svg>
      </div>
    </div>

    <div class="info">
      <div class="top">
        <div class="eq" id="eq"><i></i><i></i><i></i><i></i></div>
        <span class="source" id="source">En écoute</span>
      </div>

      <div class="title-wrap">
        <div class="title" id="title"><span id="titleText"></span></div>
      </div>

      <div class="artist" id="artist"></div>

      <div class="progress" id="progress">
        <div class="bar"><div class="fill" id="fill"></div></div>
        <div class="times">
          <span id="elapsed">0:00</span>
          <span id="total">0:00</span>
        </div>
      </div>
    </div>
  </div>

  <div id="offline" class="offline">En attente du pont En Écoute…</div>

  <script src="app.js"></script>
</body>
</html>
